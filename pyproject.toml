[project]
name = "yt-transcribe"
version = "0.1.0"
description = "One-shot transcription of a YouTube channel to per-video JSON files"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-whisper>=0.4.2",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
transcribe-channel = "transcribe_channel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["transcribe_channel.py"]
